<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance — ProaltsGen</title>
  <link rel="icon" href="{{ url_for('static', filename='images/logo.jpg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .maintenance-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #0a0a0f;
      text-align: center;
    }
    .maintenance-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 30px rgba(124,58,237,0.4);
    }
    .maintenance-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: block;
      animation: pulse-icon 2s ease-in-out infinite;
    }
    @keyframes pulse-icon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .maintenance-title {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.75rem;
    }
    .maintenance-sub {
      color: #94a3b8;
      font-size: 1.05rem;
      max-width: 440px;
      line-height: 1.65;
      margin-bottom: 2.5rem;
    }
    .discord-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #5865F2;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.85rem 2rem;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      box-shadow: 0 4px 20px rgba(88,101,242,0.35);
    }
    .discord-btn:hover {
      background: #4752c4;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(88,101,242,0.45);
    }
    .discord-btn svg {
      flex-shrink: 0;
    }
    .maintenance-footer {
      margin-top: 3rem;
      color: #334155;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <div class="maintenance-page">
    <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="ProaltsGen" class="maintenance-logo">

    <h1 class="maintenance-title">ProaltsGen est actuellement en maintenance</h1>
    <p class="maintenance-sub">
      Nous effectuons des opérations de maintenance pour améliorer votre expérience.<br>
      Rejoignez notre serveur Discord pour être informé du retour en ligne.
    </p>
    <a href="https://discord.gg/SGUdWu7qj7" target="_blank" rel="noopener" class="discord-btn">
      <svg width="22" height="22" viewBox="0 0 127.14 96.36" fill="currentColor">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
      </svg>
      Rejoignez le serveur Discord
    </a>
    <p class="maintenance-footer">© ProaltsGen</p>
  </div>
</body>
</html>
