{% extends 'base.html' %}
{% block title %}Modifier {{ service.name }} — Admin{% endblock %}

{% block content %}
<div class="container section">
  <a href="{{ url_for('admin_dashboard') }}" class="back-link">← Retour au panel admin</a>

  <div class="form-card">
    <h1 class="form-title">Modifier le service</h1>

    <form method="POST" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <label for="name" class="form-label">Nom du service *</label>
        <input type="text" id="name" name="name" class="form-input"
               value="{{ service.name }}" required>
      </div>

      <div class="form-group">
        <label for="image_url" class="form-label">URL de l'image / GIF</label>
        <input type="url" id="image_url" name="image_url" class="form-input"
               value="{{ service.image_url or '' }}" oninput="previewImg(this.value)">
        <div id="imgPreview" class="img-preview" style="{{ 'display:block' if service.image_url else 'display:none' }}">
          <img id="previewEl" src="{{ service.image_url or '' }}" alt="Aperçu" class="img-preview__img">
        </div>
      </div>

      <div class="form-group">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" name="description" class="form-input form-textarea" rows="3">{{ service.description or '' }}</textarea>
      </div>

      <div class="form-actions">
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-ghost">Annuler</a>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function previewImg(url) {
  const box = document.getElementById('imgPreview');
  const el = document.getElementById('previewEl');
  if (url) { el.src = url; box.style.display = 'block'; }
  else { box.style.display = 'none'; }
}
</script>
{% endblock %}
